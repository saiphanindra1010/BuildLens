name = "build-lens"
main = "src/index.ts"
compatibility_date = "2026-10-10"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "InvestigationSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InvestigationSession"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
